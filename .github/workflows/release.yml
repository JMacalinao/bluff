# Runs on the GitHub mirror, not Forgejo: Forgejo ignores .github/workflows
# while .forgejo/workflows exists. Forgejo builds and publishes each release;
# this copies its files to a GitHub release, so both serve the same files and
# SHA256SUMS.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing Forgejo release to copy, such as v0.1.4
        required: true

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    env:
      FORGEJO_API: https://git.macalinao.org/api/v1/repos/jj/bluff
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # Forgejo creates the release before it uploads the files, so wait until
      # every file SHA256SUMS lists is there.
      - name: Wait for the Forgejo release
        run: |
          set -euo pipefail
          for _ in $(seq 120); do
            if curl -fsS -o release.json "$FORGEJO_API/releases/tags/$TAG" \
              && sums="$(jq -r '.assets[] | select(.name == "SHA256SUMS") | .browser_download_url' release.json)" \
              && [ -n "$sums" ] && curl -fsSL -o SHA256SUMS "$sums" \
              && awk '{print $2}' SHA256SUMS \
                | jq -enR --slurpfile release release.json \
                  '[inputs] as $want | $want - [$release[0].assets[].name] == []' > /dev/null; then
              exit 0
            fi
            sleep 30
          done
          echo "::error::no complete Forgejo release for $TAG after 60 minutes"
          exit 1

      - name: Download and check the files
        run: |
          set -euo pipefail
          mkdir dist
          mv SHA256SUMS dist/
          for name in $(awk '{print $2}' dist/SHA256SUMS); do
            url="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .browser_download_url' release.json)"
            curl -fsSL -o "dist/$name" "$url"
          done
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" \
            --notes "The same files as https://git.macalinao.org/jj/bluff/releases/tag/$TAG"
