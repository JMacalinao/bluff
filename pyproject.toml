[project]
name = "bluff"
version = "0.1.0"
description = "Turn a Linux laptop into a Bluetooth keyboard and mouse for a tablet or phone"
readme = "README.md"
authors = [
    { name = "kascoord", email = "kascoord@localhost" }
]
requires-python = ">=3.14"
dependencies = [
    "dbus-fast>=5.2.0 ; sys_platform == 'linux'",
    "pyyaml>=6.0.3",
    "winrt-runtime>=3 ; sys_platform == 'win32'",
    "winrt-windows-devices-bluetooth>=3 ; sys_platform == 'win32'",
    "winrt-windows-devices-bluetooth-genericattributeprofile>=3 ; sys_platform == 'win32'",
    "winrt-windows-foundation>=3 ; sys_platform == 'win32'",
    "winrt-windows-foundation-collections>=3 ; sys_platform == 'win32'",
    "winrt-windows-storage-streams>=3 ; sys_platform == 'win32'",
]

[project.scripts]
bluff = "bluff:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "basic"
include = ["src", "tests"]
# winrt and pystray only install on Windows, so their imports stay unresolved elsewhere.
executionEnvironments = [
    { root = "src/bluff/windows", reportMissingImports = "none" },
    { root = "src" },
    { root = "tests" },
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
