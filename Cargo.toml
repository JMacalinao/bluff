[package]
name = "bluff"
version = "0.1.0"
description = "Turn a laptop into a Bluetooth keyboard and mouse for a tablet or phone"
edition = "2024"
rust-version = "1.85"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
log = "0.4"
log4rs = { version = "1.4.0", default-features = false, features = ["config_parsing", "console_appender", "yaml_format"] }
serde_yaml = "0.9"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "sync", "signal", "net", "io-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
futures-util = { version = "0.3.34", default-features = false }
libc = "0.2.191"
serde = "1.0.229"
zbus = { version = "5.13.2", default-features = false, features = ["tokio"] }
